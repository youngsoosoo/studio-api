spring:
  application:
    name: studio-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/studio}
    username: ${DB_USERNAME:studio}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: ${SERVER_PORT:8080}
