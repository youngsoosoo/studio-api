name: main CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      image_version:
        description: 롤백 또는 재배포할 기존 Docker Hub 이미지 버전
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: main-production
  cancel-in-progress: false

env:
  IMAGE_NAME: ${{ vars.DOCKERHUB_IMAGE }}

jobs:
  verify:
    name: 빌드 및 테스트
    runs-on: ubuntu-latest
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v6

      - name: Java 17 설정
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v6

      - name: Gradle 빌드
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

  release:
    name: Docker Hub 게시 및 EC2 배포
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v6

      - name: 배포 설정 확인
        env:
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          EC2_APP_ENV: ${{ secrets.EC2_APP_ENV }}
          EC2_HOST: ${{ vars.EC2_HOST }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_USER: ${{ vars.EC2_USER }}
          DOCKERHUB_PULL_TOKEN: ${{ secrets.DOCKERHUB_PULL_TOKEN }}
        run: |
          required=(
            DOCKERHUB_IMAGE DOCKERHUB_USERNAME
            EC2_APP_ENV EC2_HOST EC2_KNOWN_HOSTS EC2_SSH_PRIVATE_KEY EC2_USER
            DOCKERHUB_PULL_TOKEN
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "오류: ${name} 설정이 필요합니다." >&2
              exit 1
            fi
          done
          if [[ "$GITHUB_EVENT_NAME" == "push" && -z "$DOCKERHUB_TOKEN" ]]; then
            echo "오류: DOCKERHUB_TOKEN 설정이 필요합니다." >&2
            exit 1
          fi

      - name: 이미지 버전 생성
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.image_version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            short_sha="${GITHUB_SHA::7}"
            version="main-${GITHUB_RUN_NUMBER}-${short_sha}"
          else
            version="$REQUESTED_VERSION"
          fi
          if [[ ! "$version" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ || "$version" == "latest" ]]; then
            echo "오류: 사용할 수 없는 이미지 버전입니다: ${version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Docker Buildx 설정
        if: github.event_name == 'push'
        uses: docker/setup-buildx-action@v4

      - name: Docker Hub 로그인
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          scope: ${{ vars.DOCKERHUB_IMAGE }}@push

      - name: 버전 이미지 빌드 및 게시
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: EC2 배포 파일 준비
        env:
          EC2_APP_ENV: ${{ secrets.EC2_APP_ENV }}
          IMAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          deploy_dir="${RUNNER_TEMP}/studio-api-deploy"
          install -m 700 -d "$deploy_dir"
          cp docker-compose.yml "$deploy_dir/docker-compose.yml"
          printf '%s\n' "$EC2_APP_ENV" > "$deploy_dir/.env"
          printf 'DOCKERHUB_IMAGE=%s\nIMAGE_VERSION=%s\n' \
            "$IMAGE_NAME" "$IMAGE_VERSION" > "$deploy_dir/image.env.next"
          chmod 600 "$deploy_dir/.env" "$deploy_dir/image.env.next"

      - name: EC2 SSH 설정
        env:
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/studio-api-key
          printf '%s\n' "$EC2_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/studio-api-key ~/.ssh/known_hosts

      - name: EC2에 배포 파일 전송
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
          EC2_USER: ${{ vars.EC2_USER }}
        run: |
          ssh_options=(
            -i ~/.ssh/studio-api-key
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o ConnectTimeout=15
          )
          target="${EC2_USER}@${EC2_HOST}"
          ssh "${ssh_options[@]}" "$target" 'mkdir -p ~/studio-api'
          scp "${ssh_options[@]}" \
            "${RUNNER_TEMP}/studio-api-deploy/docker-compose.yml" \
            "${RUNNER_TEMP}/studio-api-deploy/.env" \
            "${RUNNER_TEMP}/studio-api-deploy/image.env.next" \
            "${target}:~/studio-api/"

      - name: EC2에 버전 이미지 배포
        env:
          DOCKERHUB_PULL_TOKEN: ${{ secrets.DOCKERHUB_PULL_TOKEN }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          EC2_HOST: ${{ vars.EC2_HOST }}
          EC2_USER: ${{ vars.EC2_USER }}
        run: |
          ssh_options=(
            -i ~/.ssh/studio-api-key
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o ConnectTimeout=15
          )
          target="${EC2_USER}@${EC2_HOST}"

          printf '%s' "$DOCKERHUB_PULL_TOKEN" | \
            ssh "${ssh_options[@]}" "$target" \
              "docker login --username '${DOCKERHUB_USERNAME}' --password-stdin"

          ssh "${ssh_options[@]}" "$target" '
            set -Eeuo pipefail
            cd ~/studio-api
            trap "docker logout >/dev/null 2>&1 || true" EXIT
            chmod 600 .env image.env.next
            docker compose --env-file image.env.next config --quiet
            docker compose --env-file image.env.next pull api
            mv image.env.next image.env
            docker compose --env-file image.env up -d --no-build api
            docker compose --env-file image.env ps api
          '
