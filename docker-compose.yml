# studio-api 의 PostgreSQL.
# 로컬 개발과 AWS EC2 배포에 같은 파일을 쓴다. 접속 정보는 .env 로 주입한다.
#
#   cp .env.example .env      # 값 채우기 (특히 DB_PASSWORD)
#   docker compose up -d
#   docker compose ps         # healthy 확인
#
# 애플리케이션은 DB 스키마와 데이터를 자동 생성하거나 수정하지 않는다.
# 변경이 필요하면 db/changes 아래에 검토용 SQL을 작성하고 별도 승인 절차로 실행한다.
#
# EC2에서는 포트를 루프백에만 바인딩하고 SSH 터널로 접근한다(아래 ports 참고).
# 보안 그룹에서 5432 를 열지 말 것.
services:
  postgres:
    image: postgres:17-alpine
    container_name: studio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-portfolio}
      POSTGRES_USER: ${DB_USER:-portfolio_user}
      # 미설정이면 즉시 실패시켜 원인을 명확히 한다.
      # (메시지는 콘솔 인코딩 문제를 피해 영문으로 둔다)
      POSTGRES_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required - set it in .env}"
    ports:
      # 루프백에만 바인딩 → 인터넷에 노출되지 않는다. 원격에서는 SSH 터널로 접근:
      #   ssh -i key.pem -N -L 5432:localhost:5432 ec2-user@<EIP>
      # (2단계에서 API 컨테이너가 같은 compose 네트워크에 들어오면 이 줄은 삭제 가능)
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # $$ 는 compose 보간을 피해 컨테이너 안에서 평가되게 한다.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
